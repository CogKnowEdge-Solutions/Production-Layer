services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/api/data
    environment:
      # "real" is the default so a client demo can NEVER silently run in
      # free testing mode just because .env was forgotten or LLM_MODE was
      # left unset. Without a key, real mode fails loudly (502), never
      # quietly fakes a result.
      LLM_MODE: ${LLM_MODE:-real}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-carematch-prototype}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:8080"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    # Retention is a CLI flag, not a config-file key -- Prometheus rejects
    # storage.tsdb.retention.time in prometheus_config.yml (proven by a
    # real startup error). 30d is meaningful now that prometheus_data is a
    # persistent volume that survives restarts.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus_config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  api_data:
  prometheus_data:
  grafana_data:
