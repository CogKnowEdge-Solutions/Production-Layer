global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "carematch-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "carematch-prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
