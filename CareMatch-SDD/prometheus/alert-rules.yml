groups:
  - name: carematch-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total[5m])) / sum(rate(http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate above 1% for 5 minutes"

      - alert: HighLatency
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[10m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "P95 latency above 500ms for 10 minutes"

      - alert: LowConfidenceTrend
        expr: avg(ai_confidence_distribution_sum) / avg(ai_confidence_distribution_count) < 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "AI confidence trending downward"

      - alert: HighOverrideRate
        expr: sum(coordinator_decisions_total{decision="overridden"}) / sum(coordinator_decisions_total) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Coordinator override rate above 20%"

      - alert: ApiDown
        expr: up{job="carematch-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CareMatch API instance is down"
