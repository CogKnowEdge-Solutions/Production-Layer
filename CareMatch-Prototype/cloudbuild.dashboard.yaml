      - "dashboard/Dockerfile"
      - "--build-arg"
      - "VITE_API_BASE_URL=https://carematch-api-726123996575.us-central1.run.app"
      - "."
images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/carematch-dashboard"
